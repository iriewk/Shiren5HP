<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>記録集</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet">
    <style>
        * {
            color: rgba(255, 240, 200);
            font-size: 16px;
            font-family: "M PLUS Rounded 1c", serif;
            font-weight: 400;
            font-style: normal;
        }

        body {
            background-color: rgb(20, 10, 0);
            overflow-y: scroll;
        }

        header {
            max-width: 1000px;
            width: 95%;
            background-color: rgb(20, 10, 0);
            position: sticky;
            top: 0px;
            z-index: 10;
            margin-left: auto;
            margin-right: auto;
        }

        button {
            background-color: rgb(85, 10, 10);
        }

        header div,
        header button,
        header select {
            min-height: 30px;
            font-weight: bold;
            background-color: rgb(85, 10, 10);
            margin-bottom: 2px;
        }


        header .select-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }

        header #twitter {
            grid-column: span 3;
        }

        header #twitterLabel {
            grid-column: span 3;
            display: none;
            text-align: center;
        }

        header #recordsHeader {
            display: none;
        }

        main {
            width: 95%;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        main #records {
            width: 100%;
        }

        main .modal-wall {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 95vw;
            height: 100vh;
            margin: auto;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 20;
            visibility: hidden;
        }

        main .modal-wall * {
            background: linear-gradient(315deg, rgba(2, 0, 36, 1) 0%, rgba(121, 9, 9, 1) 59%, rgba(0, 5, 50, 1) 100%);
            border-radius: 5px;
            text-align: center;
        }

        * button:hover {
            background: linear-gradient(315deg, rgb(150, 148, 177) 0%, rgba(121, 9, 9, 1) 59%, rgba(150, 148, 177) 100%);
        }

        button.inactive {
            background: linear-gradient(315deg, rgb(42, 42, 49) 0%, rgb(75, 5, 5) 59%, rgb(45, 44, 53) 100%);
            color: rgba(250, 250, 250, 0.3);
        }

        main .modal-wall .modal-main {
            border: solid 2px rgba(255, 255, 200, 0.5);
            overflow-y: auto;
            padding: 2px;
            margin-top: 20px;
            margin-left: auto;
            margin-right: auto;
            left: 10%;
            width: 99vw;
            height: 90vh;
            max-width: 800px;
            max-height: 800px;
        }

        main .modal-wall .gear-header,
        main .modal-wall .status-header,
        main .modal-wall .image-header,
        main .modal-wall .user-header {
            position: sticky;
            top: 0px;
            width: 100%;
            display: grid;
            direction: rtl;
            grid-template-columns: repeat(6, 1fr);
        }

        main #gearWall .gear-select {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(1, 1fr);
        }

        main #statusWall .status-select {
            display: grid;
        }

        main #statusWall .status-select .item {
            display: grid;
            grid-template-columns: 100px 50px 100px 1fr 100px;
            width: 100%;
            padding-bottom: 10px;
        }

        main #statusWall .status-select .item .label {
            grid-column: span 5;
        }

        main #statusWall .status-select .item .number,
        main #statusWall .status-select .item .includes-empty {
            display: grid;
            place-content: center;
            grid-row: span 2;
        }

        main #gearWall .weapons .conditions,
        main #gearWall .shields .conditions,
        main #gearWall .bracelets .conditions {
            border: solid 2px rgba(255, 255, 200, 0.5);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(25, 1fr);
        }

        main .modal-wall .label {
            background: linear-gradient(315deg, rgba(2, 0, 36, 1) 0%, rgb(78, 77, 6) 59%, rgba(0, 5, 50, 1) 100%);
            font-weight: bold;
        }

        main #gearWall .all-select,
        main #gearWall .no-select,
        main #userWall .all-select,
        main #userWall .no-select {
            width: 100%;
        }

        main #imageWall .modal-main {
            align-content: center;
        }

        main #imageWall .modal-main img {
            width: 100%;
        }

        main #userWall .modal-main .users {
            display: grid;
            align-items: start;
            grid-template-columns: repeat(2, 1fr);
        }

        main #userWall .modal-main .users button {
            display: grid;
            grid-template-columns: 50px 1fr;
        }

        main #userWall .modal-main .users button img {
            max-width: 80px;
            max-height: 80px;
            width: 80px;
            height: 80px;
        }

        a:link {
            color: rgba(255, 240, 200);
        }

        a:visited {
            color: rgba(255, 240, 200);
        }

        .header-panel {
            width: 48%;
            display: inline-block;
        }

        .now-loading {
            text-align: center;
            font-weight: bold;
            color: rgba(200, 255, 200);
        }

        .row {
            position: relative;
            background-color: rgb(50, 10, 0);
            color: rgba(255, 240, 200);
            border-top: solid 4px rgba(0, 0, 0, 0.5)
        }

        .row-odd {
            /* background-color: rgb(80, 20, 0); */
        }

        .d {
            position: absolute;
            /* border-bottom: solid 1px rgb(220, 160, 125);*/
            /*border-right: solid 1px rgb(220, 160, 125);*/
            /*border-left: solid 1px rgb(220, 160, 125);*/
            overflow-wrap: anywhere;
            width: 9.5%;
            height: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: start;
            font-weight: bold;
        }

        .d.runner,
        .d.rank {
            font-size: 1.5em;
            justify-content: center;
        }

        .d.record {
            font-size: 1.5em;
        }

        .d.date,
        .d.record,
        .d.time,
        .d.turn,
        .d.comment {
            justify-content: center;
        }

        .d.icon img {
            height: 100%;
            width: 100%;
            max-height: 80px;
            max-width: 80px;
            filter: drop-shadow(3px 2px 4px #000055);
        }

        .d.rec-id,
        .d.date,
        .d.time-sm,
        .d.turn-sm,
        .d.power-sm,
        .d.gitan-sm,
        .d.level-sm,
        .d.weapon-sm,
        .d.shield-sm,
        .d.bracelet1-sm,
        .d.bracelet2-sm,
        .d.dungeon-sm,
        .d.hp-sm,
        .d.enemies-sm,
        .d.links {
            font-size: 0.8em;
        }

        .d.links {
            justify-content: end;
        }

        .d.links button {
            font-weight: bold;
        }

        .d.links button.btn-edit {
            visibility: hidden;
        }

        .d.power-sm::before,
        .d.gitan-sm::before,
        .d.level-sm::before,
        .d.weapon-sm::before,
        .d.shield-sm::before,
        .d.bracelet1-sm::before,
        .d.bracelet2-sm::before,
        .d.hp-sm::before,
        .d.turn-sm::before,
        .d.time-sm::before,
        .d.enemies-sm::before {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            background-size: contain;
        }

        .d.power-sm::before {
            background-image: url('https://nicoshirenrank.sakura.ne.jp/image/shiren6/power.png');
        }

        .d.gitan-sm::before {
            background-image: url('https://nicoshirenrank.sakura.ne.jp/image/shiren6/gitan.png');
        }

        .d.level-sm::before {
            background-image: url('https://nicoshirenrank.sakura.ne.jp/image/shiren6/lv.png');
        }

        .d.weapon-sm::before {
            background-image: url('https://nicoshirenrank.sakura.ne.jp/image/shiren6/weapon.png');
        }

        .d.shield-sm::before {
            background-image: url('https://nicoshirenrank.sakura.ne.jp/image/shiren6/shield.png');
        }

        .d.bracelet1-sm::before,
        .d.bracelet2-sm::before {
            background-image: url('https://nicoshirenrank.sakura.ne.jp/image/shiren6/bracelet.png');
        }

        .d.hp-sm::before {
            background-image: url('https://nicoshirenrank.sakura.ne.jp/image/shiren6/hp.png');
        }

        .d.enemies-sm::before {
            background-image: url('https://nicoshirenrank.sakura.ne.jp/image/shiren6/enemies.png');
        }

        .d.time-sm::before {
            background-image: url('https://nicoshirenrank.sakura.ne.jp/image/shiren6/time.png');
        }

        .d.turn-sm::before {
            background-image: url('https://nicoshirenrank.sakura.ne.jp/image/shiren6/turn.png');
        }

        .row.header .d.runner,
        .row.header .d.rank {
            font-size: 1.0em;
        }

        .row.header .d.rec-id,
        .row.header .d.links,
        .row.header .d.date,
        .row.header .d.weapon,
        .row.header .d.shield,
        .row.header .d.power,
        .row.header .d.gitan,
        .row.header .d.level,
        .row.header .d.bracelet1,
        .row.header .d.bracelet2,
        .row.header .d.hp,
        .row.header .d.enemies {
            font-size: 0.8em;
        }

        .d.shiren img {
            height: 100%;
            max-height: 80px;
            max-width: 80px;
            filter: drop-shadow(3px 2px 4px #000055);
        }

        .row {
            height: 80px;
            width: 100%;
            background: linear-gradient(315deg, rgba(2, 0, 36, 1) 0%, rgba(121, 9, 9, 1) 59%, rgba(0, 212, 255, 0) 100%);
        }

        .comment {
            overflow-y: auto;
        }

        option.no-rec {
            color: gray;
            background-color: black;
        }

        @media screen and (max-width: 768px) {
            * {
                font-size: 2vw;
            }

            img {
                max-width: 100px;
            }

            .d {
                height: 25.0%;
            }

            .row {
                height: 100px;
                width: 95%;
            }

            .rule {
                background-color: rgba(0, 30, 0);
                color: rgb(240, 240, 130);
                border: solid 1px rgba(80, 120, 80);
            }

            main #gearWall .gear-select {
                grid-template-columns: repeat(1, 1fr);
                grid-template-rows: repeat(3, 1fr);
            }

            main #gearWall .gear-main .weapons .conditions,
            main #gearWall .gear-main .shields .conditions,
            main #gearWall .gear-main .bracelets .conditions {
                grid-template-columns: repeat(5, 1fr);
                grid-template-rows: repeat(10, 1fr);
            }
        }

        @media screen and (max-width: 512px) {
            * {
                font-size: 2.5vw;
            }
        }
    </style>

        /**
         * カテゴリ設定
         */
        class CategoryConfig {
            constructor(options) {
                this.name = options.name;
                /** @type {Row}*/
                this.rowDef = options.rowDef;
                this.csvUrl = options.csvUrl;
                this.defaultDungeon = options.defaultDungeon
                this.dungeons = options.dungeons;
                this.extFilter = options.extFilter;
                this.groupCols = options.groupCols;
                /** @type {SortType[]} */
                this.sortCols = options.sortCols;
                this.header = null;
                this.records = null;
                this.users = null;
            }
        }

        /**
         * 並び替え
         */
        class SortType {
            constructor(colIdx, asc = true, conv = null) {
                this.colIdx = colIdx;
                this.asc = asc;
                this.conv = conv || (e => e);
            }
        }

        /**
         * 記録行定義
         */
        class RowOption {
            constructor(
                pcHeadH,
                spHeadH,
                pcBodyH,
                spBodyH,
                pcColPosition,
                spColPosition
            ) {
                /** @type {number} */
                this.pcHeaderHeight = pcHeadH;
                /** @type {number} */
                this.spHeaderHeight = spHeadH;
                /** @type {number} */
                this.pcBodyHeight = pcBodyH;
                /** @type {number} */
                this.spBodyHeight = spBodyH;
                /** @type {object[]} */
                this.pcColPosition = pcColPosition;
                /** @type {object[]} */
                this.spColPosition = spColPosition;
            }
        }
        class Row {
            /**
             * @param {Col[]} cols
             * @param {RowOption} option
             */
            constructor(cols, option = null) {
                /** @type {Col[]} */
                this.cols = cols;
                /** @type {RowOption} */
                this.option = option;
                // レイアウト適用
                option.pcColPosition?.forEach((v, i) => this.cols[i].pcSizePos = new ColPos(v.w, v.h, v.x, v.y));
                option.spColPosition?.forEach((v, i) => this.cols[i].spSizePos = new ColPos(v.w, v.h, v.x, v.y));
            }

            /**
             * ヘッダ
             */
            outHeader(regulationName, dungeonName, headerNames) {
                const headerTxts = this.cols.map(c => {
                    const name = c.name || headerNames[c.colSelector(regulationName, dungeonName)];
                    return `<div class="d ${c.className}">${name}</div>`;
                }).join('');
                return `<div class="row header">${headerTxts}</div>`
            }
            /**
             * ボディ
             */
            outValue(regulationName, dungeonName, vals, addClass, rowIdx) {
                const colVals = this.cols
                    .map(c => {
                        const colIdx = c.colSelector(regulationName, dungeonName);
                        return c.out(vals[colIdx], vals, rowIdx);
                    })
                    .join('');
                return `<div class="row ${addClass}">${colVals}</div>`;
            }
            /**
             * スタイル
             */
            createStyle() {

                // デフォルトスタイル（≒PC表示用）
                let left = 0;
                let pcStyle = this.cols.map((c, i) => {
                    const pos = this.cols[i - 1]?.pcSizePos;
                    left = pos
                        ? pos.left > 0
                            ? Math.max(pos.left + pos.width, left)
                            : left + pos.width
                        : 0;
                    return `.${c.className.split(' ').join('.')} {${c.pcSizePos.outStyle(`${left}`)}}`;
                }).join("\n");
                pcStyle += [
                    this.option?.pcHeaderHeight ? `#recordsHeader .row.header { height:${this.option?.pcHeaderHeight}px; }` : '',
                    this.option?.pcBodyHeight ? `#records .row { height:${this.option?.pcBodyHeight}px; }` : ''
                ].join("\n");

                // 画面幅小スタイル（≒スマホ表示用）
                left = 0;
                let spStyle = this.cols.map((c, i) => {
                    const pos = this.cols[i - 1]?.spSizePos;
                    left = pos
                        ? pos.left > 0
                            ? Math.max(pos.left + pos.width, left)
                            : left + pos.width
                        : 0;
                    return `.${c.className.split(' ').join('.')} {${c.spSizePos.outStyle(`${left}`)}}`;
                }).join("\n");
                spStyle += [
                    this.option?.spHeaderHeight ? `#recordsHeader .row.header { height:${this.option?.spHeaderHeight}px; }` : '',
                    this.option?.spBodyHeight ? `#records .row { height:${this.option?.spBodyHeight}px; }` : ''
                ].join("\n");

                return `
                    ${pcStyle}
                    @media screen and (max-width: 768px) {
                        ${spStyle}
                    }
                `;
            }
        }

        /**

        class Col {
            constructor(name, className, colSelector, pcSizePos, spSizePos, valueFormatter = null) {
                // 表示文字
                this.name = name;
                // 設定クラス
                this.className = className;
                // CSV行データ配列からデータを抽出する処理
                this.colSelector = colSelector;
                // PC画面でのサイズ定義
                this.pcSizePos = pcSizePos;
                // スマホ画面でのサイズ定義
                this.spSizePos = spSizePos || pcSizePos;
                // HTML出力処理
                this.valOut = valueFormatter || ((val) => val);
                this.out = ((val, allVal, rowIdx) => `<div class="d ${this.className}">${this.valOut(val, allVal, rowIdx)}</div>`);
            }
        }

        /**
         * カラム位置情報
         */
        class ColPos {
            /**
             * @param {number} width 幅（%）
             * @param {number} height 高さ（%）
             * @param {number} left X座標（%）
             * @param {number} top Y座標（%）
             */
            constructor(width, height, left, top) {
                this.width = width;
                this.left = left;
                this.top = top;
                this.height = height;
            }
            outStyle(defaultLeft) {
                if (this.width <= 0 && (!this.height || this.height <= 0)) {
                    return "display:none";
                } else {
                    return `
                        top: ${this.top ?? 0}%;
                        left: ${this.left ?? defaultLeft}%;
                        width: ${this.width}%;
                        ${this.height ? 'height:' + this.height + '%' : ''}
                    `;
                }
            }
        }
        class InputRange {
            constructor(target, isTime = false) {
                this.isTime = isTime;
                this.$from = document.querySelector(`${target} input.number.from`);
                this.$to = document.querySelector(`${target} input.number.to`);
                this.$fromRange = document.querySelector(`${target} input[type="range"].from`);
                this.$toRange = document.querySelector(`${target} input[type="range"].to`);
                this.$btnIncludesEmpty = document.querySelector(`${target} button.includes-empty`);

                this.$from.addEventListener('input', () => this.applyValue(true, true));
                this.$to.addEventListener('input', () => this.applyValue(true, false));
                this.$fromRange.addEventListener('input', () => this.applyValue(false, true));
                this.$toRange.addEventListener('input', () => this.applyValue(false, false));
                this.$btnIncludesEmpty.addEventListener('click', () => utils.toggleBtn(this.$btnIncludesEmpty));
            }
            applyValue(isInputValue, isFrom) {

                let from = isInputValue
                    ? this.convertValue(this.$from.value, this.isTime ? 'time-num' : 'num')
                    : this.convertValue(this.$fromRange.value, 'num');

                let to = isInputValue
                    ? this.convertValue(this.$to.value, this.isTime ? 'time-num' : 'num')
                    : this.convertValue(this.$toRange.value, 'num');

                from = (!isFrom && from > to) ? to : from;
                to = (isFrom && from > to) ? from : to;

                this.$from.value = this.convertValue(from, this.isTime ? 'num-time' : 'num');
                this.$to.value = this.convertValue(to, this.isTime ? 'num-time' : 'num');
                this.$fromRange.value = from;
                this.$toRange.value = to;
                return false;
            }

            setCondition = (condition) => {
                this.$from.value = condition.from;
                this.$to.value = condition.to;
                this.applyValue(true, false);
                utils.toggleBtn(this.$btnIncludesEmpty, condition.includesEmpty);
            }

            getCondition = () => ({
                from: this.convertValue(this.$from.value, this.isTime ? 'plain' : 'num'),
                to: this.convertValue(this.$to.value, this.isTime ? 'plain' : 'num'),
                includesEmpty: utils.isActiveBtn(this.$btnIncludesEmpty)
            });

            convertValue = (text, mode = 'plain') => {
                switch (mode) {
                    case 'time-num':
                        const parts = text.split(':');
                        const hhSec = parseInt(parts[0]) * 60 * 60;
                        const mmSec = parseInt(parts[1]) * 60;
                        const ssSec = parseInt(parts[2]);
                        return hhSec + mmSec + ssSec;

                    case 'num-time':
                        const totalSeconds = parseInt(text);
                        const hh = `${Math.floor(totalSeconds / 3600)}`.padStart(2, "0");
                        const mm = `${Math.floor((totalSeconds % 3600) / 60)}`.padStart(2, "0");
                        const ss = `${totalSeconds % 60}`.padStart(2, "0");
                        return `${hh}:${mm}:${ss}`;

                    case 'num':
                        return parseInt(text);

                    default:
                    case 'plain':
                        return text;
                }
            }
        }

                this.$regulationsSelect.innerHTML = REGURATIONS.map(c => `<option>${c.name}</option>`).join("");

                // イベント設定
                this.$regulationsSelect.addEventListener('change', () => this.changeRegulation(this.$regulationsSelect.value));
                this.$dungeonSelect.addEventListener('change', () => this.changeDungeon(this.$dungeonSelect.value));
                this.$termSelect.addEventListener('change', () => {
                    this.currentTerm = this.$termSelect.value;
                    this.loadRecords();
                });
                document.querySelectorAll('button.toggle').forEach(b => b.addEventListener('click', (e) => utils.toggleBtn(e.target)));
                this.$allGearSelects.forEach(s => s.addEventListener('click', (e) => {
                    e.target.closest('.items').querySelectorAll('.conditions button').forEach(b => utils.toggleBtn(b, true));
                }));
                this.$noGearSelects.forEach(s => s.addEventListener('click', (e) => {
                    e.target.closest('.items').querySelectorAll('.conditions button').forEach(b => utils.toggleBtn(b, false));
                }));
                this.$btnOpenGear.addEventListener('click', () => this.openGearCondition());
                this.$btnGearDone.addEventListener('click', () => this.closeGearCondition(true));
                this.$btnGearCancel.addEventListener('click', () => this.closeGearCondition(false));

                this.$btnOpenStatus.addEventListener('click', () => this.openStatusCondition());
                this.$btnStatusDone.addEventListener('click', () => this.closeStatusCondition(true));
                this.$btnStatusCancel.addEventListener('click', () => this.closeStatusCondition(false));

                this.$btnOpenUser.addEventListener('click', () => this.openUserCondition());
                this.$allUserSelect.addEventListener('click', (e) => e.target.closest('.user-select').querySelectorAll('.users button').forEach(b => utils.toggleBtn(b, true)));
                this.$noUserSelect.addEventListener('click', (e) => e.target.closest('.user-select').querySelectorAll('.users button').forEach(b => utils.toggleBtn(b, false)));
                this.$btnUserDone.addEventListener('click', () => this.closeUserCondition(true));
                this.$btnUserCancel.addEventListener('click', () => this.closeUserCondition(false));

                this.$btnImageCancel.addEventListener('click', () => this.closeImage());

                this.$regulationsSelect.value = this.currentConfig.name;
                this.$twitter.addEventListener('click', () => this.$twitterCombine.src = `register.html?${new Date().getSeconds()}`);
                // X連携待ち
                window.addEventListener('message', (event) => {
                    if (event.origin === window.origin && event.data.action == "xauth") {
                        window.xauth = event.data.message;
                        console.log(event.data.message);
                        this.$twitterCombine.src = '';
                        this.$twitter.style.display = 'none';
                        this.$twitterLabel.style.display = 'block';
                        this.$twitterLabel.innerHTML = utils.escapeHtml(`Twitter認証済：${window.xauth.username}`);
                        utils.showEditBtn();
                    }
                });
                this.$twitterCombine.src = `register.html?mode=checkonly&${new Date().getSeconds()}`
            };

            /**
             * 装備条件の選択
             */
            openGearCondition = () => {
                [
                    { elems: Array.from(this.$wepons.querySelectorAll('button')), cond: this.gearCondition.weapons },
                    { elems: Array.from(this.$shields.querySelectorAll('button')), cond: this.gearCondition.shields },
                    { elems: Array.from(this.$bracelets.querySelectorAll('button')), cond: this.gearCondition.bracelets }
                ].forEach(target => {
                    // いったんクリア
                    target.elems.forEach(e => {
                        e.classList.remove('active');
                        e.classList.add('inactive');
                    });
                    // 現在の条件に合うものをアクティブ表示
                    target.elems
                        .filter(e => target.cond.includes(e.textContent))
                        .forEach(e => {
                            e.classList.remove('inactive');
                            e.classList.add('active');
                        });
                });
                this.$gearModal.style.visibility = 'visible';
            }

            /**
             * 詳細条件の選択
             */
            openStatusCondition = () => {
                this.inputTime.setCondition(this.statusCondition.time);
                this.inputTurn.setCondition(this.statusCondition.turn);
                this.inputLv.setCondition(this.statusCondition.level);
                this.inputHp.setCondition(this.statusCondition.hp);
                this.inputEnemies.setCondition(this.statusCondition.enemies);
                this.inputPower.setCondition(this.statusCondition.power);
                this.inputGitan.setCondition(this.statusCondition.gitan);
                Array.from(this.$btnsCharacters).forEach(b => utils.toggleBtn(b, this.statusCondition.characters.length == 0 || this.statusCondition.characters.includes(b.textContent)));
                utils.toggleBtn(this.$btnHasOnlyVideo, this.statusCondition.hasVideoOnly);
                this.$statusModal.style.visibility = 'visible';
            }

            /**
             * 画像表示
             */
            openImage = (imgaeUrl) => {
                this.$image.src = imgaeUrl;
                this.$imageModal.style.visibility = 'visible';
                return false;
            }

            /**
             * ユーザー条件の表示
             */
            openUserCondition = () => {
                if (this.userCondition.length == 0) {
                    this.$userList.querySelectorAll(`button`).forEach(b => utils.toggleBtn(b, true));
                } else {
                    this.$userList.querySelectorAll(`button`).forEach(b => utils.toggleBtn(b, false));
                    this.userCondition.forEach(u => {
                        utils.toggleBtn(this.$userList.querySelector(`button[data-id="${u}"]`), true);
                    })
                }
                this.$userModal.style.visibility = 'visible';
            }

            /**
             * 装備条件の選択
             */
            closeGearCondition = (isDone) => {
                if (isDone) {
                    this.gearCondition.weapons = Array.from(this.$wepons.querySelectorAll('button.active')).map(e => e.textContent);
                    this.gearCondition.shields = Array.from(this.$shields.querySelectorAll('button.active')).map(e => e.textContent);
                    this.gearCondition.bracelets = Array.from(this.$bracelets.querySelectorAll('button.active')).map(e => e.textContent);
                    this.changeRegulation(this.currentConfig.name, this.dungeonName);
                }
                this.$gearModal.style.visibility = 'hidden';
            }
            /**
             * 詳細条件の選択
             */
            closeStatusCondition = (isDone) => {
                if (isDone) {
                    this.statusCondition.time = this.inputTime.getCondition();
                    this.statusCondition.turn = this.inputTurn.getCondition();
                    this.statusCondition.level = this.inputLv.getCondition();
                    this.statusCondition.hp = this.inputHp.getCondition();
                    this.statusCondition.enemies = this.inputEnemies.getCondition();
                    this.statusCondition.power = this.inputPower.getCondition();
                    this.statusCondition.gitan = this.inputGitan.getCondition();
                    this.statusCondition.characters = Array.from(this.$btnsCharacters).filter(utils.isActiveBtn).map(b => b.textContent);
                    this.statusCondition.hasVideoOnly = utils.isActiveBtn(this.$btnHasOnlyVideo);
                    this.changeRegulation(this.currentConfig.name, this.dungeonName);
                }
                this.$statusModal.style.visibility = 'hidden';
            }

            /**
             * 画像閉じる
             */
            closeImage = () => {
                this.$imageModal.style.visibility = 'hidden';
            }

            /**
             * ユーザー条件閉じる
             */
            closeUserCondition = (isDone) => {
                if (isDone) {
                    this.userCondition = Array.from(this.$userList.querySelectorAll('button')).filter(b => utils.isActiveBtn(b)).map(b => b.attributes['data-id'].value);
                    this.changeRegulation(this.currentConfig.name, this.dungeonName);
                }
                this.$userModal.style.visibility = 'hidden';
            }

            /**
             * 記録取得処理
             * @param options.config {object}
             * @param options.dungeonName {string}
             * @param options.gear {object}
             * @param options.status {object}
             * @param options.users {string[]}
             * @param options.term {string}
             */
            getRecords = (options = {}) => {

                const targetConfig = options.config || this.currentConfig;
                const dungeon = options.dungeonName || this.dungeonName || this.currentConfig.defaultDungeon;
                const gearCondition = options.gear || this.gearCondition;
                const statusCondition = options.status || this.statusCondition;
                const userCondition = options.users || this.userCondition || [];
                const term = options.term || this.currentTerm || ALL_TER;

                const dungeonFilter = (r) => dungeon == DUNGEON_NO_SELECT || r[CSV_COL.DUNGEON_NAME] == dungeon;
                const termFilter = (r) => term == ALL_TERM || `${r[CSV_COL.TIMESTAMP]}`.startsWith(term);
                const gearFilter = (r) => {
                    const weaponOk = gearCondition.weapons.length == WEAPON_NAMES.length || gearCondition.weapons?.includes(r[CSV_COL.WEAPON_NAME] || UNKNOWN);
                    const shieldOk = gearCondition.shields.length == SHIELD_NAMES.length || gearCondition.shields?.includes(r[CSV_COL.SHIELD_NAME] || UNKNOWN);
                    const braceletOk =
                        gearCondition.bracelets.length == BRACELET_NAMES.length ||
                        gearCondition.bracelets?.includes(r[CSV_COL.BRACELET1] || UNKNOWN) ||
                        gearCondition.bracelets?.includes(r[CSV_COL.BRACELET2] || UNKNOWN);
                    return weaponOk && shieldOk && braceletOk;
                };
                const rangeCheck = (inputs, v) => {
                    return !v
                        ? inputs.includesEmpty
                        : inputs.from <= v && v <= inputs.to;
                }
                const videoFilter = (r) => r[CSV_COL.VIDEO_URL] || !this.statusCondition.hasVideoOnly;
                const levelFilter = (r) => rangeCheck(statusCondition.level, r[CSV_COL.LEVEL]);
                const hpFilter = (r) => rangeCheck(statusCondition.hp, r[CSV_COL.HP]);
                const enemiesFilter = (r) => rangeCheck(statusCondition.enemies, r[CSV_COL.ENEMIES]);
                const powerFilter = (r) => rangeCheck(statusCondition.power, r[CSV_COL.POWER]);
                const gitanFilter = (r) => rangeCheck(statusCondition.gitan, r[CSV_COL.GITAN]);
                const timeFilter = (r) => rangeCheck(statusCondition.time, r[CSV_COL.TIME]);
                const turnFilter = (r) => rangeCheck(statusCondition.turn, r[CSV_COL.TURN]);
                const userFilter = (r) => userCondition.length == 0 || userCondition.includes(r[CSV_COL.PLAYER_ID]);
                const characterFilter = (r) => statusCondition.characters.length == 0 || statusCondition.characters.includes(r[CSV_COL.SHIREN]);

                const baseRecords = targetConfig.records
                    .filter(dungeonFilter)
                    .filter(termFilter)
                    .filter(gearFilter)
                    .filter(videoFilter)
                    .filter(levelFilter)
                    .filter(hpFilter)
                    .filter(enemiesFilter)
                    .filter(powerFilter)
                    .filter(gitanFilter)
                    .filter(timeFilter)
                    .filter(turnFilter)
                    .filter(userFilter)
                    .filter(characterFilter)
                    .sort((r1, r2) => utils.compare(r1, r2, targetConfig.sortCols));

                return targetConfig.groupCols?.length > 0
                    ? utils.grouping(baseRecords, targetConfig.groupCols)
                    : baseRecords;
            }

            /**
            * レギュ変更処理
            */
            changeRegulation = async (name, dungeonName) => {
                const conf = REGURATIONS.find(c => c.name == name);
                if (conf) {
                    this.$main.innerHTML = '<div class="now-loading">読込中</div>';
                    this.$recordsHeader.innerHTML = "";
                    this.currentConfig = conf;
                    if (!this.currentConfig.records) {
                        const csvArray = (await utils.fetchCsv(this.currentConfig.csvUrl, this.csvCache))
                            .filter(r => !this.currentConfig.extFilter || this.currentConfig.extFilter(r));
                        this.currentConfig.header = csvArray[0];
                        this.currentConfig.records = csvArray.slice(2);
                        this.currentConfig.users = Array.from(new Map(csvArray.slice(2)
                            .map(r => [r[CSV_COL.PLAYER_ID], {
                                id: r[CSV_COL.PLAYER_ID],
                                name: r[CSV_COL.NAME],
                                url: r[CSV_COL.USER_IMAGE_URL]
                            }]))
                            .values());
                        this.currentConfig.terms = [ALL_TERM, ...new Set(this.currentConfig.records.map(r => r[CSV_COL.TIMESTAMP].substring(0, 7)))];
                    }

                    // ダンジョン指定（1:指定を優先、2:現在表示中、3:レギュのデフォルト）
                    dungeonName = dungeonName && this.currentConfig.dungeons.includes(dungeonName)
                        ? dungeonName
                        : this.currentConfig.dungeons.includes(this.$dungeonSelect.value)
                            ? this.$dungeonSelect.value
                            : this.currentConfig.defaultDungeon;

                    this.$dungeonSelect.innerHTML = this.currentConfig.dungeons
                        .map(d => {
                            const records = this.getRecords({ dungeonName: d });
                            const count = `${records.length}`.padStart(3, "_");
                            const style = records.length <= 0 ? 'no-rec' : '';
                            return `<option value="${d}" class="${style}">${count}：${d}</option>`;
                        })
                        .join("");
                    this.$dungeonSelect.value = dungeonName;
                    this.dungeonName = dungeonName;
                    this.$recordStyle.innerHTML = this.currentConfig.rowDef.createStyle();
                    this.$userList.innerHTML = this.currentConfig.users.map(u => `<button class="toggle item active" data-id="${u.id}" onclick="utils.toggleBtn(this)"><img src="${u.url}">${utils.escapeHtml(u.name)}</button>`).join("");
                    this.changeDungeon(this.$dungeonSelect.value);
                }
            }

            /**
            * ダンジョン変更
            */
            changeDungeon = (targetDungeonName) => {
                const terms = this.currentConfig.terms
                    .sort().reverse()
                    .map(e => {
                        const records = this.getRecords({ dungeonName: targetDungeonName, term: e });
                        const style = records.length <= 0 ? 'no-rec' : '';
                        const count = records.length.toString().padStart(3, "_");
                        const disp = `${count}：${e}`;
                        return {
                            value: e,
                            disp: disp,
                            style: style
                        }
                    });
                this.$termSelect.innerHTML = terms.map(e => `<option value="${e.value}" class="${e.style}">${e.disp}</option>`).join("");
                this.$termSelect.value = terms.find(e => e.value == ALL_TERM).value;
                this.dungeonName = targetDungeonName;
                this.loadRecords();
            }

            /**
            * 期間変更
            */
            changeTerm = (trem) => {
                this.currentTerm = term;
                this.loadRecords();
            }

            /**
            * 画面に記録を表示 
            * @param {CategoryConfig} config
            */
            loadRecords = async () => {
                const config = this.currentConfig;
                const recordsHtml = this.getRecords()
                    .map((r, i) => config.rowDef.outValue(config.name, this.dungeonName, r, (i % 2 == 0 ? 'row-odd' : ''), i))
                    .join("");
                const header = config.rowDef.outHeader(config.name, this.dungeonName, config.header);
                this.$recordsHeader.innerHTML = header;
                this.$main.innerHTML = recordsHtml;
                utils.showEditBtn();
            }
        }

        /**
         * ユーティリティ
         */
        const utils = {
            /**
             * ソート用比較
             * @param {SortType[]} sortCols
             */
            compare: (r1, r2, sortCols) => {
                for (const c of sortCols) {
                    const v1 = c.conv(r1[c.colIdx]);
                    const v2 = c.conv(r2[c.colIdx]);
                    if ((v1 == null && v2 == null) || (v1 == v2)) {
                        continue;
                    } else {
                        return c.asc
                            ? v2 == ""
                                ? -1
                                : v1 < v2 ? -1 : 1
                            : v1 == ""
                                ? -1
                                : v1 > v2 ? -1 : 1
                    }
                }
            },

            /**
             * グループ化
             */
            grouping: (records, groupCols) => {
                const groupingRec = records.reduce((acc, rec) => {
                    let key = groupCols.map(k => rec[k]).join("-");
                    if (!acc[key]) {
                        acc[key] = []
                    }
                    acc[key].push(rec);
                    return acc;
                }, {});
                return Object.values(groupingRec).map(recs => recs[0]);
            },

            /**
             * CSVデータ取得
             */
            fetchCsv: async (csvUrl, cache) => {
                if (cache?.[csvUrl]) {
                    return cache[csvUrl];
                }
                const res = await fetch(csvUrl, { mnode: 'cors' });
                const text = await res.text();
                const csvArray = text.split("\r\n").map(r => utils.txtToArray(r));
                cache[csvUrl] = csvArray;
                return csvArray;
            },

            /**
             * CSV行読込 ※Googleスプシの仕様上改行やカンマが含まれるときに"が付く様子
             */
            txtToArray: (txt) => {
                // ダブルクォーテーションで囲まれていないカンマで分割
                const regex = /,(?=(?:[^"]*"[^"]*")*[^"]*$)/g;
                const items = txt.split(regex);
                // 各要素の両端のダブルクォーテーションを削除
                const result = items.map(item => item.replace(/^"|"$/g, ''));
                return result;
            },

            /**
             * エスケープ
             */
            escapeHtml: (str) => {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                };
                return `${str}`.replace(/[&<>"']/g, match => map[match]);
            },

            isActiveBtn: ($button) => $button.classList.contains('active'),

            toggleBtn: ($button, isActive = null) => {
                if (isActive != null) {
                    ['active', 'inactive'].forEach(c => $button.classList.remove(c));
                    $button.classList.add(isActive ? 'active' : 'inactive');
                } else {
                    ['active', 'inactive'].forEach(c => $button.classList.toggle(c));
                }
            },

            showEditBtn: () => {
                Array.from(document.querySelectorAll('.btn-edit'))
                    .filter(e => e.attributes?.screenName?.value == window.xauth?.screenName)
                    .forEach(e => e.style.visibility = 'visible');
            },

            createLinks(val, all) {
                return [
                    `<button onclick="utils.openEditRecord(this)" editkey="${all[CSV_COL.EDITKEY]}" class="btn-edit" screenName="${all[CSV_COL.TWITTERID]}">更新</button>`,
                    (all[CSV_COL.RESULT_IMAGE_URL] ? `<button onclick="pageState.openImage('${all[CSV_COL.RESULT_IMAGE_URL]}')">画像</button>` : ''),
                    (all[CSV_COL.REC_URL] ? `<button onclick="window.open('${all[CSV_COL.REC_URL]}')">ポスト</button>` : ''),
                    (all[CSV_COL.VIDEO_URL] ? `<button onclick="window.open('${all[CSV_COL.VIDEO_URL]}')" >動画</button>` : ''),
                ].filter(v => v).join("&nbsp")
            },

            /**
             * 更新用URL作成
             */
            openEditRecord($btn) {
                const url = Encrypter.decrypt($btn.attributes?.editkey?.value, window.xauth.shirenToken);
                window.open(url);
            }
        }

        /**
         * 読み込み時イベント
         */
        var pageState = null;
        window.onload = async () => {
            try {
                pageState = new PageState();
                pageState.init();

                // クエリパラメータより条件して設定取得
                const urlParams = new URLSearchParams(window.location.search);
                const params = Object.fromEntries(urlParams.entries());

                pageState.userCondition = params.users?.split(',') || [];
                // 初期ロード
                await pageState.changeRegulation(pageState.currentConfig.name);
            } catch (e) {
                console.error(e);
            }
        };
    </script>
</head>

<body>
    <header>
        <div class="select-box">
            <div id="twitterLabel"></div>
            <button id="twitter">Twitter連携する</button>
            <select id='regulations'></select>
            <select id='dungeons'></select>
            <select id='term'></select>
            <button id='openGear'>装備条件</button>
            <button id='openStatus'>詳細条件</button>
            <button id='openUser'>ユーザー</button>
        </div>
        <div id='recordsHeader'></div>
    </header>
    <main>
        <div id="gearWall" class="modal-wall">
            <div class="modal-main">
                <div class="gear-header">
                    <button class="cancel">キャンセル</button>
                    <button class="done">決定</button>
                </div>
                <div class="gear-select">
                    <div class="items weapons">
                        <div class="label">武器</div>
                        <button class="all-select">全て選択</button>
                        <button class="no-select">選択解除</button>
                        <div class="conditions"></div>
                    </div>
                    <div class="items shields">
                        <div class="label">盾</div>
                        <button class="all-select">全て選択</button>
                        <button class="no-select">選択解除</button>
                        <div class="conditions"></div>
                    </div>
                    <div class="items bracelets">
                        <div class="label">腕輪</div>
                        <button class="all-select">全て選択</button>
                        <button class="no-select">選択解除</button>
                        <div class="conditions"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="statusWall" class="modal-wall">
            <div class="modal-main">
                <div class="status-header">
                    <button class="cancel">キャンセル</button>
                    <button class="done">決定</button>
                </div>
                <div class="status-select">
                    <div class="item time">
                        <div class="label">タイム</div>
                        <input type="time" class="from number" value="00:00:00" step="2">
                        <div class="number">～</div>
                        <input type="time" class="to number" value="23:59:59" step="2">
                        <input type="range" class="from" min="0" max="86399" value="0">
                        <button class="includes-empty active">不明を含む</button>
                        <input type="range" class="to" min="0" max="86399" value="86399">
                    </div>
                    <div class="item turn">
                        <div class="label">ターン数</div>
                        <input type="number" class="from number" value="1" min="1" max="99999">
                        <div class="number">～</div>
                        <input type="number" class="to number" value="99999" min="1" max="99999">
                        <input type="range" class="from" min="1" max="99999" value="1">
                        <button class="includes-empty active">不明を含む</button>
                        <input type="range" class="to" min="1" max="99999" value="99999">
                    </div>
                    <div class="item level">
                        <div class="label">LV</div>
                        <input type="number" class="from number" value="1" min="1" max="99">
                        <div class="number">～</div>
                        <input type="number" class="to number" value="99" min="1" max="99">
                        <input type="range" class="from" min="1" max="99" value="1">
                        <button class="includes-empty active">不明を含む</button>
                        <input type="range" class="to" min="1" max="99" value="99">
                    </div>
                    <div class="item hp">
                        <div class="label">HP</div>
                        <input type="number" class="from number" value="1" min="1" max="999">
                        <div class="number">～</div>
                        <input type="number" class="to number" value="999" min="1" max="999">
                        <input type="range" class="from" min="1" max="999" value="1">
                        <button class="includes-empty active">不明を含む</button>
                        <input type="range" class="to" min="1" max="999" value="999">
                    </div>
                    <div class="item enemies">
                        <div class="label">倒した敵</div>
                        <input type="number" class="from number" value="0" min="0" max="9999">
                        <div class="number">～</div>
                        <input type="number" class="to number" value="9999" min="0" max="9999">
                        <input type="range" class="from" min="0" max="9999" value="0">
                        <button class="includes-empty active">不明を含む</button>
                        <input type="range" class="to" min="0" max="9999" value="9999">
                    </div>
                    <div class="item power">
                        <div class="label">ちから</div>
                        <input type="number" class="from number" value="1" min="1" max="99">
                        <div class="number">～</div>
                        <input type="number" class="to number" value="99" min="1" max="99">
                        <input type="range" class="from" min="1" max="99" value="1">
                        <button class="includes-empty active">不明を含む</button>
                        <input type="range" class="to" min="1" max="99" value="99">
                    </div>
                    <div class="item gitan">
                        <div class="label">ギタン</div>
                        <input type="number" class="from number" value="0" min="0" max="99999">
                        <div class="number">～</div>
                        <input type="number" class="to number" value="999999" min="0" max="999999">
                        <input type="range" class="from" min="0" max="999999" value="0">
                        <button class="toggle includes-empty active">不明を含む</button>
                        <input type="range" class="to" min="0" max="999999" value="999999">
                    </div>
                </div>
                <div class="status-select-optional">
                    <div class="characters">
                        <div class="label">使用キャラ</div>
                        <button class="toggle active">シレン</button>
                        <button class="toggle active">狐渇シレン</button>
                        <button class="toggle active">竜海シレン</button>
                        <button class="toggle active">アスカ</button>
                        <button class="toggle active">コッパ</button>
                    </div>
                    <div class="video">
                        <div class="label">動画</div>
                        <button class="toggle inactive">動画ありの記録のみ</button>
                    </div>
                </div>
            </div>
        </div>
        <div id="imageWall" class="modal-wall">
            <div class="modal-main">
                <div class="image-header">
                    <button class="cancel">とじる</button>
                </div>
                <img src="">
            </div>
        </div>
        <div id="userWall" class="modal-wall">
            <div class="modal-main">
                <div class="user-header">
                    <button class="cancel">キャンセル</button>
                    <button class="done">決定</button>
                </div>
                <div class="label">風来人</div>
                <div class="user-select">
                    <button class="all-select">全て選択</button>
                    <button class="no-select">選択解除</button>
                    <div class="users">
                    </div>
                </div>
            </div>
        </div>
        <div id="records"></div>
        <div>
            <iframe id="twitterCombine" style="display: none;"></iframe>
        </div>
    </main>
