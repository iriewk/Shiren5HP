    <style>
        * {
            color: rgba(255, 240, 200);
        }

        body {
            background-color: rgb(20, 10, 0);
        }

        input {
            height: 100%;
            width: 100%;
        }

        select.half {
            width: 48%;
        }

        select.full {
            width: 96%;
        }

        select {
            height: 5vh;
            font-weight: bold;
            background-color: rgb(85, 10, 10);
            margin-bottom: 2px;
        }

        header {
            max-width: 1000px;
            width: 100vw;
            background-color: rgb(20, 10, 0);
            position: sticky;
            width: 100vw;
            top: 0px;
            z-index: 10;
            margin-left: auto;
            margin-right: auto;
        }

        header .select-box {
            width: 100%;
        }

        header .regulations {
            width: 48%;
        }

        main {
            width: 100vw;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        main #records {
            width: 100%;
        }

        a:link {
            color: rgba(255, 240, 200);
        }

        a:visited {
            color: rgba(255, 240, 200);
        }

        .header-panel {
            width: 48%;
            display: inline-block;
        }

        .now-loading {
            text-align: center;
            font-weight: bold;
            color: rgba(200, 255, 200);
        }

        .row {
            position: relative;
            background-color: rgb(50, 10, 0);
            color: rgba(255, 240, 200);
            border-top: solid rgba(0, 0, 0, 0.5)
        }

        .row-odd {
            /* background-color: rgb(80, 20, 0); */
        }

        .d {
            position: absolute;
            /* border-bottom: solid 1px rgb(220, 160, 125);*/
            /*border-right: solid 1px rgb(220, 160, 125);*/
            /*border-left: solid 1px rgb(220, 160, 125);*/
            overflow-wrap: anywhere;
            width: 9.5%;
            height: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .d.runner {
            font-size: 1.5em;
        }

        .d.rank {
            font-size: 1.5em;
        }

        .d.icon img {
            height: 100%;
            width: 100%;
            max-height: 80px;
            max-width: 80px;
            filter: drop-shadow(3px 2px 4px #000055);
        }

        .d.rec-id,
        .d.weapon,
        .d.shield,
        .d.power,
        .d.gitan,
        .d.level,
        .d.bracelet1,
        .d.bracelet2,
        .d.hp,
        .d.enemies {
            font-size: 0.8em;
        }

        .d.shiren img {
            height: 100%;
            max-height: 80px;
            max-width: 80px;
            filter: drop-shadow(3px 2px 4px #000055);
        }

        .row {
            height: 80px;
            width: 96%;
            background: linear-gradient(315deg, rgba(2, 0, 36, 1) 0%, rgba(121, 9, 9, 1) 59%, rgba(0, 212, 255, 0) 100%);
        }

        .comment {
            overflow-y: auto;
        }

        option.no-rec {
            color: gray;
            background-color: black;
        }

        @media screen and (max-width: 768px) {
            * {
                font-size: 2vw;
            }

            img {
                max-width: 100px;
            }

            .d {
                height: 25.0%;
            }

            .row {
                height: 100px;
                width: 98vw;
            }

            .rule {
                background-color: rgba(0, 30, 0);
                color: rgb(240, 240, 130);
                border: solid 1px rgba(80, 120, 80);
            }
        }

        @media screen and (max-width: 512px) {
            * {
                font-size: 3vw;
            }
        }

        /**
         * カテゴリ設定
         */
        class CategoryConfig {
            constructor(name, rowDef, csvUrl, defaultDungeon, dungeons, extFilter, groupCols, sortCols) {

                /** @type {Row}*/

                /** @type {SortType[]} */

                this.header = null;
                this.records = null;
            }
        }

        /**
         * 並び替え
         */
        class SortType {
            constructor(colIdx, asc = true, conv = null) {
                this.colIdx = colIdx;
                this.asc = asc;
                this.conv = conv || (e => e);
            }
        }

        /**
         * 記録行定義
         */
        class RowOption {
            constructor(
                pcHeadH,
                spHeadH,
                pcBodyH,
                spBodyH,
                pcColPosition,
                spColPosition
            ) {
                /** @type {number} */
                this.pcHeaderHeight = pcHeadH;
                /** @type {number} */
                this.spHeaderHeight = spHeadH;
                /** @type {number} */
                this.pcBodyHeight = pcBodyH;
                /** @type {number} */
                this.spBodyHeight = spBodyH;
                /** @type {object[]} */
                this.pcColPosition = pcColPosition;
                /** @type {object[]} */
                this.spColPosition = spColPosition;
            }
        }
        class Row {
            /**
             * @param {Col[]} cols
             * @param {RowOption} option
             */
            constructor(cols, option = null) {
                /** @type {Col[]} */
                this.cols = cols;
                /** @type {RowOption} */
                this.option = option;
                // レイアウト適用
                option.pcColPosition?.forEach((v, i) => this.cols[i].pcSizePos = new ColPos(v.w, v.h, v.x, v.y));
                option.spColPosition?.forEach((v, i) => this.cols[i].spSizePos = new ColPos(v.w, v.h, v.x, v.y));
            }

            /**
             * ヘッダ
             */
            outHeader(regulationName, dungeonName, headerNames) {
                const headerTxts = this.cols.map(c => {
                    const name = c.name || headerNames[c.colSelector(regulationName, dungeonName)];
                    return `<div class="d ${c.className}">${name}</div>`;
                }).join('');
                return `<div class="row header">${headerTxts}</div>`
            }
            /**
             * ボディ
             */
            outValue(regulationName, dungeonName, vals, addClass, rowIdx) {
                const colVals = this.cols
                    .map(c => {
                        const colIdx = c.colSelector(regulationName, dungeonName);
                        return c.out(vals[colIdx], vals, rowIdx);
                    })
                    .join('');
                return `<div class="row ${addClass}">${colVals}</div>`;
            }
            /**
             * スタイル
             */
            createStyle() {

                // デフォルトスタイル（≒PC表示用）
                let left = 0;
                let pcStyle = this.cols.map((c, i) => {
                    const pos = this.cols[i - 1]?.pcSizePos;
                    left = pos
                        ? pos.left > 0
                            ? Math.max(pos.left + pos.width, left)
                            : left + pos.width
                        : 0;
                    return `.${c.className.split(' ').join('.')} {${c.pcSizePos.outStyle(`${left}`)}}`;
                }).join("\n");
                pcStyle += [
                    this.option?.pcHeaderHeight ? `#recordsHeader .row.header { height:${this.option?.pcHeaderHeight}px; }` : '',
                    this.option?.pcBodyHeight ? `#records .row { height:${this.option?.pcBodyHeight}px; }` : ''
                ].join("\n");

                // 画面幅小スタイル（≒スマホ表示用）
                left = 0;
                let spStyle = this.cols.map((c, i) => {
                    const pos = this.cols[i - 1]?.spSizePos;
                    left = pos
                        ? pos.left > 0
                            ? Math.max(pos.left + pos.width, left)
                            : left + pos.width
                        : 0;
                    return `.${c.className.split(' ').join('.')} {${c.spSizePos.outStyle(`${left}`)}}`;
                }).join("\n");
                spStyle += [
                    this.option?.spHeaderHeight ? `#recordsHeader .row.header { height:${this.option?.spHeaderHeight}px; }` : '',
                    this.option?.spBodyHeight ? `#records .row { height:${this.option?.spBodyHeight}px; }` : ''
                ].join("\n");

                return `
                    ${pcStyle}
                    @media screen and (max-width: 768px) {
                        ${spStyle}
                    }
                `;
            }
        }

        /**
         * 記録カラム定義
         */
        class Col {
            constructor(name, className, colSelector, pcSizePos, spSizePos, valueFormatter = null) {
                // 表示文字
                this.name = name;
                // 設定クラス
                this.className = className;
                // CSV行データ配列からデータを抽出する処理
                this.colSelector = colSelector;
                // PC画面でのサイズ定義
                this.pcSizePos = pcSizePos;
                // スマホ画面でのサイズ定義
                this.spSizePos = spSizePos;
                // HTML出力処理
                this.valOut = valueFormatter || ((val) => val);
                this.out = ((val, allVal, rowIdx) => `<div class="d ${this.className}">${this.valOut(val, allVal, rowIdx)}</div>`);
            }
        }

        /**
         * カラム位置情報
         */
        class ColPos {
            /**
             * @param {number} width 幅（%）
             * @param {number} height 高さ（%）
             * @param {number} left X座標（%）
             * @param {number} top Y座標（%）
             */
            constructor(width, height, left, top) {
                this.width = width;
                this.left = left;
                this.top = top;
                this.height = height;
            }
            outStyle(defaultLeft) {
                if (this.width <= 0 && (!this.height || this.height <= 0)) {
                    return "display:none";
                } else {
                    return `
                        top: ${this.top ?? 0}%;
                        left: ${this.left ?? defaultLeft}%;
                        width: ${this.width}%;
                        ${this.height ? 'height:' + this.height + '%' : ''}
                    `;
                }
            }
        }

                    new ColPos(15, 50, 20, 20), new ColPos(20, 55, 80, 30), (val) => val ? `<img src="${SHIREN_MAP[val]}"></img>` : ''),
                new Col("動画", "video", (r, d) => CSV_COL.VIDEO_URL,
                    new ColPos(15, 20, 20, 60), new ColPos(20, 15, 80, 85), (val, all) => val ? `<a href="${val}" target="_blank">動画</a>` : ''),
                new Col("アイコン", "icon", (r, d) => CSV_COL.IMG_URL,
                    new ColPos(10, 100, 35, 0), new ColPos(15, 70, 15, 10), (val) => val ? `<img src="${val}"></img>` : ''),
                new Col("走者", "runner", (r, d) => CSV_COL.NAME,
                    new ColPos(55, 20, 45, 10), new ColPos(50, 30, 30, 10)),
                new Col("コメント", "comment", (r, d) => CSV_COL.COMMENT,
                    new ColPos(55, 40, 45, 40), new ColPos(50, 40, 30, 30), (val) => val ? `${(escapeHtml(val.replace(/^"|"$/g, '')))}` : ''),

                new Col("LV", "level", (r, d) => CSV_COL.LEVEL,
                    new ColPos(10, 10, 45, 80), new ColPos(15, 15, 0, 85)),
                new Col("HP", "hp", (r, d) => CSV_COL.HP,
                    new ColPos(10, 10, 45, 90), new ColPos(15, 15, 0, 85)),
                new Col("倒した敵の数", "enemies", (r, d) => CSV_COL.ENEMIES,
                    new ColPos(10, 10, 55, 80), new ColPos(15, 15, 0, 85)),
                new Col("武器", "weapon", (r, d) => CSV_COL.WEAPON_NAME,
                    new ColPos(15, 10, 65, 80), new ColPos(15, 15, 0, 85)),
                new Col("盾", "shield", (r, d) => CSV_COL.SHIELD_NAME,
                    new ColPos(15, 10, 65, 90), new ColPos(15, 15, 0, 85)),
                new Col("腕輪1", "bracelet1", (r, d) => CSV_COL.BRACELET1,
                    new ColPos(15, 10, 80, 80), new ColPos(15, 15, 0, 85)),
                new Col("腕輪2", "bracelet2", (r, d) => CSV_COL.BRACELET2,
                    new ColPos(15, 10, 80, 90), new ColPos(15, 15, 0, 85)),
                new Col("ちから", "power", (r, d) => CSV_COL.POWER,
                    new ColPos(10, 10, 90, 80), new ColPos(15, 15, 0, 85)),
                new Col("ギタン", "gitan", (r, d) => CSV_COL.GITAN,
                    new ColPos(10, 10, 90, 90), new ColPos(15, 15, 0, 85)),
            ], new RowOption(80, 80, 150, 150)),
            // レイアウト：全記録用
            ROW_DEF_ALL: new Row([
                new Col("記録ID", "rec-id", (r, d) => CSV_COL.REC_ID,
                    new ColPos(10, 10, 0, 0), new ColPos(15, 15, 0, 85)),
                new Col("RTA", "time-rta", (r, d) => CSV_COL.TIME_RTA,
                    new ColPos(20, 20, 0, 10), new ColPos(15, 15, 0, 10), (val) => val || "--:--:--"),
                new Col("IGT", "time-igt", (r, d) => CSV_COL.TIME_IGT,
                    new ColPos(20, 20, 0, 35), new ColPos(15, 15, 0, 35), (val) => val || "--:--:--"),
                new Col("ターン数", "record", (r, d) => CSV_COL.TURN,
                    new ColPos(20, 20, 0, 60), new ColPos(15, 15, 0, 60), (val) => val || "--"),
                new Col("日付", "date", (r, d) => CSV_COL.TIMESTAMP,
                    new ColPos(15, 30, 20, 0), new ColPos(20, 20, 80, 10), (val, all) => val ? `<a href="${all[CSV_COL.REC_URL]}" target="_blank">${val.substring(2)}</a>` : ''),
                new Col("使用キャラ", "shiren", (r, d) => CSV_COL.SHIREN,
                    new ColPos(15, 50, 20, 30), new ColPos(20, 55, 80, 30), (val) => val ? `<img src="${SHIREN_MAP[val]}"></img>` : ''),
                new Col("動画", "video", (r, d) => CSV_COL.VIDEO_URL,
                    new ColPos(15, 15, 20, 80), new ColPos(20, 15, 80, 85), (val, all) => val ? `<a href="${val}" target="_blank">動画</a>` : ''),
                new Col("アイコン", "icon", (r, d) => CSV_COL.IMG_URL,
                    new ColPos(10, 100, 35, 0), new ColPos(15, 70, 15, 10), (val) => val ? `<img src="${val}"></img>` : ''),
                new Col("走者", "runner", (r, d) => CSV_COL.NAME,
                    new ColPos(55, 30, 45, 10), new ColPos(50, 30, 30, 10)),
                new Col("コメント", "comment", (r, d) => CSV_COL.COMMENT,
                    new ColPos(55, 40, 45, 40), new ColPos(50, 45, 30, 30), (val) => val ? `${(escapeHtml(val.replace(/^"|"$/g, '')))}` : ''),
                new Col("LV", "level", (r, d) => CSV_COL.LEVEL,
                    new ColPos(10, 10, 45, 80), new ColPos(15, 15, 0, 85)),
                new Col("HP", "hp", (r, d) => CSV_COL.HP,
                    new ColPos(10, 10, 45, 90), new ColPos(15, 15, 0, 85)),
                new Col("倒した敵の数", "enemies", (r, d) => CSV_COL.ENEMIES,
                    new ColPos(10, 10, 55, 80), new ColPos(15, 15, 0, 85)),
                new Col("武器", "weapon", (r, d) => CSV_COL.WEAPON_NAME,
                    new ColPos(15, 10, 65, 80), new ColPos(15, 15, 0, 85)),
                new Col("盾", "shield", (r, d) => CSV_COL.SHIELD_NAME,
                    new ColPos(15, 10, 65, 90), new ColPos(15, 15, 0, 85)),
                new Col("腕輪1", "bracelet1", (r, d) => CSV_COL.BRACELET1,
                    new ColPos(15, 10, 80, 80), new ColPos(15, 15, 0, 85)),
                new Col("腕輪2", "bracelet2", (r, d) => CSV_COL.BRACELET2,
                    new ColPos(15, 10, 80, 90), new ColPos(15, 15, 0, 85)),
                new Col("ちから", "power", (r, d) => CSV_COL.POWER,
                    new ColPos(10, 10, 90, 80), new ColPos(15, 15, 0, 85)),
                new Col("ギタン", "gitan", (r, d) => CSV_COL.GITAN,
                    new ColPos(10, 10, 90, 90), new ColPos(15, 15, 0, 85)),
            ], new RowOption(80, 100, 150, 150))
        }

        /**
         * レギュ一覧
         */
        const REGURATIONS = [
            new CategoryConfig("走者別：タイム(IGT)", LAYOUTS.ROW_DEF_TA, CSV_DATA_URL, 'とぐろ島の神髄',
                ALL_DUNGEONS.filter(e => !['とぐろ島（初戦撃破）', 'とぐろ島（2戦目以降撃破）'].includes(e)), null, [CSV_COL.PLAYER_ID], [new SortType(CSV_COL.TIME_IGT)]),
            new CategoryConfig("走者別：タイム(RTA)", LAYOUTS.ROW_DEF_RTA, CSV_DATA_URL, 'とぐろ島（初戦撃破）', ['とぐろ島（初戦撃破）', 'とぐろ島（2戦目以降撃破）'], null, [CSV_COL.PLAYER_ID], [new SortType(CSV_COL.TIME_IGT)]),
            new CategoryConfig("走者別：ターン数", LAYOUTS.ROW_DEF_TURN, CSV_DATA_URL, 'とぐろ島（初戦撃破）', ALL_DUNGEONS, null, [CSV_COL.PLAYER_ID], [new SortType(CSV_COL.TURN, true, (e => parseInt(e)))]),
            new CategoryConfig("全記録", LAYOUTS.ROW_DEF_ALL, CSV_DATA_URL, 'とぐろ島（初戦撃破）', ALL_DUNGEONS, null, [], [new SortType(CSV_COL.REC_ID)]),
        ];

        // 状態値
        const state = {
            /** @type {Element} */
            $main: null,
            /** @type {Element} */
            $recordsHeader: null,
            /** @type {Element} */
            $dungeonSelect: null,
            /** @type {Element} */
            $regulationsSelect: null,
            /** @type {Element} */
            $termSelect: null,
            /** @type {Element} */
            $recordStyle: null,
            currentTerm: ALL_TERM,
            csvCache: {},
            currentConfig: REGURATIONS[0]
        };

        /**
         * ソート用比較
         * @param {SortType[]} sortCols
         */
        function compare(r1, r2, sortCols) {
            for (const c of sortCols) {
                const v1 = c.conv(r1[c.colIdx]);
                const v2 = c.conv(r2[c.colIdx]);
                if ((v1 == null && v2 == null) || (v1 == v2)) {
                    continue;
                } else {
                    return c.asc
                        ? v2 == ""
                            ? -1
                            : v1 < v2 ? -1 : 1
                        : v1 == ""
                            ? -1
                            : v1 > v2 ? -1 : 1
                }
            }
        };

        /**
         * グループ化
         */
        function grouping(records, groupCols) {
            const groupingRec = records.reduce((acc, rec) => {
                let key = groupCols.map(k => rec[k]).join("-");
                if (!acc[key]) {
                    acc[key] = []
                }
                acc[key].push(rec);
                return acc;
            }, {});
            return Object.values(groupingRec).map(recs => recs[0]);
        }

        /**
         * CSVデータ取得
         */
        async function fetchCsv(csvUrl, cache) {
            if (cache?.[csvUrl]) {
                return cache[csvUrl];
            }
            const res = await fetch(csvUrl);
            const text = await res.text();
            const csvArray = text.split("\r\n").map(r => txtToArray(r));
            cache[csvUrl] = csvArray;
            return csvArray;
        }
        /**
         * CSV行読込 ※Googleスプシの仕様上改行やカンマが含まれるときに"が付く様子
         */
        function txtToArray(txt) {
            // ダブルクォーテーションで囲まれていないカンマで分割
            const regex = /,(?=(?:[^"]*"[^"]*")*[^"]*$)/g;
            const items = txt.split(regex);
            // 各要素の両端のダブルクォーテーションを削除
            const result = items.map(item => item.replace(/^"|"$/g, ''));
            return result;
        };

        /**
         * エスケープ
         */
        function escapeHtml(str) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            };
            return `${str}`.replace(/[&<>"']/g, match => map[match]);
        };

        /**
         * 記録取得処理
         */
        function getRecords(targetConfig, dungeon, term = ALL_TERM) {

            const recordFilter = term == ALL_TERM
                ? (r) => r[CSV_COL.DUNGEON_NAME] == dungeon
                : (r) => r[CSV_COL.DUNGEON_NAME] == dungeon && `${r[CSV_COL.TIMESTAMP]}`.startsWith(term);

            const baseRecords = targetConfig.records
                .filter(recordFilter)
                .sort((r1, r2) => compare(r1, r2, targetConfig.sortCols));

            return targetConfig.groupCols?.length > 0
                ? grouping(baseRecords, targetConfig.groupCols)
                : baseRecords;
        }

        /**
         * レギュ変更処理
         */
        async function changeRegulation(name) {
            const conf = REGURATIONS.find(c => c.name == name);
            if (conf) {
                state.$main.innerHTML = '<div class="now-loading">読込中</div>';
                state.$recordsHeader.innerHTML = "";
                state.$dungeonSelect.value = "";
                state.currentConfig = conf;
                if (!state.currentConfig.records) {
                    const csvArray = (await fetchCsv(state.currentConfig.csvUrl, state.csvCache))
                        .filter(r => !state.currentConfig.extFilter || state.currentConfig.extFilter(r));
                    state.currentConfig.header = csvArray[0];
                    state.currentConfig.records = csvArray.slice(1);
                    state.currentConfig.terms = [ALL_TERM, ...new Set(state.currentConfig.records.map(r => r[CSV_COL.TIMESTAMP].substring(0, 7)))];
                }
                state.$dungeonSelect.innerHTML = state.currentConfig.dungeons
                    .map(d => {
                        const records = getRecords(state.currentConfig, d);
                        const count = `${records.length}`.padStart(3, "_");
                        const style = records.length <= 0 ? 'no-rec' : '';
                        return `<option value="${d}" class="${style}">${count}：${d}</option>`;
                    })
                    .join("");
                state.$dungeonSelect.value = state.currentConfig.defaultDungeon;
                state.$recordStyle.innerHTML = state.currentConfig.rowDef.createStyle();
                changeDungeon(state.currentConfig, state.$dungeonSelect.value);
            }
        }

        /**
         * ダンジョン変更
         * @param {CategoryConfig} config
         */
        function changeDungeon(config, targetDungeonName) {
            const terms = state.currentConfig.terms
                .sort().reverse()
                .map(e => {
                    const records = getRecords(config, targetDungeonName, e);
                    const style = records.length <= 0 ? 'no-rec' : '';
                    const count = records.length.toString().padStart(3, "_");
                    const disp = `${count}：${e}`;
                    return {
                        value: e,
                        disp: disp,
                        style: style
                    }
                });
            state.$termSelect.innerHTML = terms.map(e => `<option value="${e.value}" class="${e.style}">${e.disp}</option>`).join("");
            state.$termSelect.value = terms.find(e => e.value == ALL_TERM).value;
            loadRecords(
                config,
                targetDungeonName,
                state.$termSelect.value,
            );
        }

        /**
        * @param {CategoryConfig} config
        */
        async function loadRecords(config, targetDungeonName, targetTerm) {
            const regulationName = config.name;
            const rowDef = config.rowDef;
            const dungeonName = targetDungeonName || config.defaultDungeon;
            const term = targetTerm || state.currentTerm;
            const records = getRecords(state.currentConfig, dungeonName, term);
            const recordsHtml = records
                .map((r, i) => rowDef.outValue(regulationName, dungeonName, r, (i % 2 == 0 ? 'row-odd' : ''), i))
                .join("");
            const header = rowDef.outHeader(regulationName, dungeonName, config.header);
            state.$recordsHeader.innerHTML = header;
            state.$main.innerHTML = recordsHtml;
        }

        /**
         * 読み込み時イベント
         */
        window.onload = async () => {
            try {
                // 画面各要素
                state.$main = document.querySelector('#records');
                state.$recordsHeader = document.querySelector('#recordsHeader');
                state.$dungeonSelect = document.querySelector('#dungeons');
                state.$regulationsSelect = document.querySelector('#regulations');
                state.$termSelect = document.querySelector('#term');
                state.$recordStyle = document.querySelector('#recordStyle');

                // イベント設定
                state.$regulationsSelect.addEventListener('change', () => changeRegulation(state.$regulationsSelect.value));
                state.$dungeonSelect.addEventListener('change', () => changeDungeon(state.currentConfig, state.$dungeonSelect.value));
                state.$termSelect.addEventListener('change', () => loadRecords(state.currentConfig, state.$dungeonSelect.value, state.$termSelect.value));

                // レギュ一覧出力
                state.$regulationsSelect.innerHTML = REGURATIONS.map(c => `<option>${c.name}</option>`).join("");

                // 初期表示
                state.$regulationsSelect.value = state.currentConfig.name;
                await changeRegulation(state.currentConfig.name);
            } catch (e) {
                console.error(e);
            }
        };
    </script>

    </style>
