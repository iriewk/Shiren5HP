    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>記録集</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
        * {
            color: rgba(255, 240, 200);
        }

        body {
            background-color: rgb(20, 10, 0);
            overflow-y: scroll;
        }

        input {
            height: 100%;
            width: 100%;
        }

        header button.one-eighth,
        header select.one-eighth {
            width: 12%;
        }

        header button.quater,
        header select.quater {
            width: 24%;
        }

        header button.half,
        header select.half {
            width: 48%;
        }


        header button.full,
        header select.full {
            width: 96%;
        }

        header button,
        header select {
            height: 5vh;
            font-weight: bold;
            background-color: rgb(85, 10, 10);
            margin-bottom: 2px;
        }

        header {
            max-width: 1000px;
            width: 100vw;
            background-color: rgb(20, 10, 0);
            position: sticky;
            width: 100vw;
            top: 0px;
            z-index: 10;
            margin-left: auto;
            margin-right: auto;
        }

        header .select-box {
            width: 100%;
        }

        header .regulations {
            width: 48%;
        }

        main {
            width: 100vw;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        main #records {
            width: 100%;
        }

        main #gearWall {
            position: fixed;
            top: 0px;
            left: 0px;
            width: 95vw;
            height: 100vh;
            margin: auto;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 20;
            visibility: hidden;
        }

        main #gearWall * {
            background: linear-gradient(315deg, rgba(2, 0, 36, 1) 0%, rgba(121, 9, 9, 1) 59%, rgba(0, 5, 50, 1) 100%);
            border-radius: 5px;
            text-align: center;
        }

        button:hover,
        button.inactive:hover,
        main #gearWall button.inactive:hover,
        main #gearWall button.active:hover,
        main #gearWall button:hover {
            background: linear-gradient(315deg, rgb(150, 148, 177) 0%, rgba(121, 9, 9, 1) 59%, rgba(150, 148, 177) 100%);
        }

        button.inactive {
            background: linear-gradient(315deg, rgb(42, 42, 49) 0%, rgb(75, 5, 5) 59%, rgb(45, 44, 53) 100%);
            color: rgba(250, 250, 250, 0.3);
        }

        main #gearWall .gear-main {
            border: solid 2px rgba(255, 255, 200, 0.5);
            overflow-y: auto;
            padding: 2px;
            margin-top: 20px;
            margin-left: auto;
            margin-right: auto;
            left: 10%;
            width: 99vw;
            height: 90vh;
            max-width: 800px;
            max-height: 800px;
        }

        main #gearWall .gear-header {
            width: 100%;
            display: grid;
            direction: rtl;
            grid-template-columns: repeat(6, 1fr);
        }

        main #gearWall .gear-select {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(1, 1fr);
        }

        main #gearWall .gear-main .weapons .conditions,
        main #gearWall .gear-main .shields .conditions,
        main #gearWall .gear-main .bracelets .conditions {
            border: solid 2px rgba(255, 255, 200, 0.5);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(25, 1fr);
        }

        main #gearWall .gear-main .label {
            background: linear-gradient(315deg, rgba(2, 0, 36, 1) 0%, rgb(78, 77, 6) 59%, rgba(0, 5, 50, 1) 100%);
            font-weight: bold;
        }

        main #gearWall .gear-main .all-select,

            width: 100%;
        }

        a:link {
            color: rgba(255, 240, 200);
        }

        a:visited {
            color: rgba(255, 240, 200);
        }

        .header-panel {
            width: 48%;
            display: inline-block;
        }

        .now-loading {
            text-align: center;
            font-weight: bold;
            color: rgba(200, 255, 200);
        }

        .row {
            position: relative;
            background-color: rgb(50, 10, 0);
            color: rgba(255, 240, 200);
            border-top: solid rgba(0, 0, 0, 0.5)
        }

            /* background-color: rgb(80, 20, 0); */
        }

            /*border-right: solid 1px rgb(220, 160, 125);*/
            /*border-left: solid 1px rgb(220, 160, 125);*/
            overflow-wrap: anywhere;

            height: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .d.runner,
        .d.rank {

        }

        .d.icon img {
            height: 100%;
            width: 100%;
            max-height: 80px;
            max-width: 80px;
            filter: drop-shadow(3px 2px 4px #000055);
        }

        .d.power,
        .d.gitan,
        .d.level,
        .d.weapon,
        .d.shield,
        .d.bracelet1,
        .d.bracelet2,

            font-size: 0.8em;

        }

        }

        }

            }

            }

            }

            }

                color: rgb(240, 240, 130);
                border: solid 1px rgba(80, 120, 80);
            }

            main #gearWall .gear-select {

                grid-template-rows: repeat(3, 1fr);
            }

                grid-template-rows: repeat(10, 1fr);

        /**
         * カテゴリ設定
         */
        class CategoryConfig {
            constructor(name, rowDef, csvUrl, defaultDungeon, dungeons, extFilter, groupCols, sortCols) {
                this.name = name;
                /** @type {Row}*/
                this.rowDef = rowDef;
                this.csvUrl = csvUrl;
                this.defaultDungeon = defaultDungeon
                this.dungeons = dungeons;
                this.extFilter = extFilter;
                this.groupCols = groupCols;
                /** @type {SortType[]} */
                this.sortCols = sortCols;
                this.header = null;
                this.records = null;
            }
        }

        /**
         * 並び替え
         */
        class SortType {
            constructor(colIdx, asc = true, conv = null) {
                this.colIdx = colIdx;
                this.asc = asc;
                this.conv = conv || (e => e);
            }
        }

        /**
         * 記録行定義
         */
        class RowOption {
            constructor(
                pcHeadH,
                spHeadH,
                pcBodyH,
                spBodyH,
                pcColPosition,
                spColPosition
            ) {
                /** @type {number} */
                this.pcHeaderHeight = pcHeadH;
                /** @type {number} */
                this.spHeaderHeight = spHeadH;
                /** @type {number} */
                this.pcBodyHeight = pcBodyH;
                /** @type {number} */
                this.spBodyHeight = spBodyH;
                /** @type {object[]} */
                this.pcColPosition = pcColPosition;
                /** @type {object[]} */
                this.spColPosition = spColPosition;
            }
        }
        class Row {
            /**
             * @param {Col[]} cols
             * @param {RowOption} option
             */
            constructor(cols, option = null) {
                /** @type {Col[]} */
                this.cols = cols;
                /** @type {RowOption} */
                this.option = option;
                // レイアウト適用
                option.pcColPosition?.forEach((v, i) => this.cols[i].pcSizePos = new ColPos(v.w, v.h, v.x, v.y));
                option.spColPosition?.forEach((v, i) => this.cols[i].spSizePos = new ColPos(v.w, v.h, v.x, v.y));
            }

            /**
             * ヘッダ
             */
            outHeader(regulationName, dungeonName, headerNames) {
                const headerTxts = this.cols.map(c => {
                    const name = c.name || headerNames[c.colSelector(regulationName, dungeonName)];
                    return `<div class="d ${c.className}">${name}</div>`;
                }).join('');
                return `<div class="row header">${headerTxts}</div>`
            }
            /**
             * ボディ
             */
            outValue(regulationName, dungeonName, vals, addClass, rowIdx) {
                const colVals = this.cols
                    .map(c => {
                        const colIdx = c.colSelector(regulationName, dungeonName);
                        return c.out(vals[colIdx], vals, rowIdx);
                    })
                    .join('');
                return `<div class="row ${addClass}">${colVals}</div>`;
            }
            /**
             * スタイル
             */
            createStyle() {

                // デフォルトスタイル（≒PC表示用）
                let left = 0;
                let pcStyle = this.cols.map((c, i) => {
                    const pos = this.cols[i - 1]?.pcSizePos;
                    left = pos
                        ? pos.left > 0
                            ? Math.max(pos.left + pos.width, left)
                            : left + pos.width
                        : 0;
                    return `.${c.className.split(' ').join('.')} {${c.pcSizePos.outStyle(`${left}`)}}`;
                }).join("\n");
                pcStyle += [
                    this.option?.pcHeaderHeight ? `#recordsHeader .row.header { height:${this.option?.pcHeaderHeight}px; }` : '',
                    this.option?.pcBodyHeight ? `#records .row { height:${this.option?.pcBodyHeight}px; }` : ''
                ].join("\n");

                // 画面幅小スタイル（≒スマホ表示用）
                left = 0;
                let spStyle = this.cols.map((c, i) => {
                    const pos = this.cols[i - 1]?.spSizePos;
                    left = pos
                        ? pos.left > 0
                            ? Math.max(pos.left + pos.width, left)
                            : left + pos.width
                        : 0;
                    return `.${c.className.split(' ').join('.')} {${c.spSizePos.outStyle(`${left}`)}}`;
                }).join("\n");
                spStyle += [
                    this.option?.spHeaderHeight ? `#recordsHeader .row.header { height:${this.option?.spHeaderHeight}px; }` : '',
                    this.option?.spBodyHeight ? `#records .row { height:${this.option?.spBodyHeight}px; }` : ''
                ].join("\n");

                return `
                    ${pcStyle}
                    @media screen and (max-width: 768px) {
                        ${spStyle}
                    }
                `;
            }
        }

        /**
         * 記録カラム定義
         */
        class Col {
            constructor(name, className, colSelector, pcSizePos, spSizePos, valueFormatter = null) {
                // 表示文字
                this.name = name;
                // 設定クラス
                this.className = className;
                // CSV行データ配列からデータを抽出する処理
                this.colSelector = colSelector;
                // PC画面でのサイズ定義
                this.pcSizePos = pcSizePos;
                // スマホ画面でのサイズ定義
                this.spSizePos = spSizePos || pcSizePos;
                // HTML出力処理
                this.valOut = valueFormatter || ((val) => val);
                this.out = ((val, allVal, rowIdx) => `<div class="d ${this.className}">${this.valOut(val, allVal, rowIdx)}</div>`);
            }
        }

        /**
         * カラム位置情報
         */
        class ColPos {
            /**

             * @param {number} height 高さ（%）

        /**
         * ソート用比較
         * @param {SortType[]} sortCols
         */
        function compare(r1, r2, sortCols) {
            for (const c of sortCols) {
                const v1 = c.conv(r1[c.colIdx]);
                const v2 = c.conv(r2[c.colIdx]);
                if ((v1 == null && v2 == null) || (v1 == v2)) {
                    continue;
                } else {
                    return c.asc
                        ? v2 == ""
                            ? -1
                            : v1 < v2 ? -1 : 1
                        : v1 == ""
                            ? -1
                            : v1 > v2 ? -1 : 1
                }
            }
        };

        /**
         * グループ化
         */
        function grouping(records, groupCols) {
            const groupingRec = records.reduce((acc, rec) => {
                let key = groupCols.map(k => rec[k]).join("-");
                if (!acc[key]) {
                    acc[key] = []
                }
                acc[key].push(rec);
                return acc;
            }, {});
            return Object.values(groupingRec).map(recs => recs[0]);
        }

        /**
         * CSVデータ取得
         */
        async function fetchCsv(csvUrl, cache) {
            if (cache?.[csvUrl]) {
                return cache[csvUrl];
            }
            const res = await fetch(csvUrl);
            const text = await res.text();
            const csvArray = text.split("\r\n").map(r => txtToArray(r));
            cache[csvUrl] = csvArray;
            return csvArray;
        }
        /**
         * CSV行読込 ※Googleスプシの仕様上改行やカンマが含まれるときに"が付く様子
         */
        function txtToArray(txt) {
            // ダブルクォーテーションで囲まれていないカンマで分割
            const regex = /,(?=(?:[^"]*"[^"]*")*[^"]*$)/g;
            const items = txt.split(regex);
            // 各要素の両端のダブルクォーテーションを削除
            const result = items.map(item => item.replace(/^"|"$/g, ''));
            return result;
        };

        /**
         * エスケープ
         */
        function escapeHtml(str) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            };
            return `${str}`.replace(/[&<>"']/g, match => map[match]);
        };

        /**
         * 記録取得処理
         */
        function getRecords(targetConfig, dungeon, gearCondition, term = ALL_TERM) {

            const dungeonTermFilter = term == ALL_TERM
                ? (r) => r[CSV_COL.DUNGEON_NAME] == dungeon
                : (r) => r[CSV_COL.DUNGEON_NAME] == dungeon && `${r[CSV_COL.TIMESTAMP]}`.startsWith(term);

            const gearFilter = (r) => {
                const weaponOk = gearCondition.weapons?.includes(r[CSV_COL.WEAPON_NAME] || UNKNOWN);
                const shieldOk = gearCondition.shields?.includes(r[CSV_COL.SHIELD_NAME] || UNKNOWN);
                const braceletOk = gearCondition.bracelets?.includes(r[CSV_COL.BRACELET1] || UNKNOWN) || gearCondition.bracelets?.includes(r[CSV_COL.BRACELET2] || UNKNOWN);
                return weaponOk && shieldOk && braceletOk;
            };

            const videoFilter = (r) => r[CSV_COL.VIDEO_URL] || !state.hasVideoOnly;

            const baseRecords = targetConfig.records
                .filter(dungeonTermFilter)
                .filter(gearFilter)
                .filter(videoFilter)
                .sort((r1, r2) => compare(r1, r2, targetConfig.sortCols));

            return targetConfig.groupCols?.length > 0
                ? grouping(baseRecords, targetConfig.groupCols)
                : baseRecords;
        }

        /**
         * レギュ変更処理
         */
        async function changeRegulation(name) {
            const conf = REGURATIONS.find(c => c.name == name);
            if (conf) {
                state.$main.innerHTML = '<div class="now-loading">読込中</div>';
                state.$recordsHeader.innerHTML = "";
                state.$dungeonSelect.value = "";
                state.currentConfig = conf;
                if (!state.currentConfig.records) {
                    const csvArray = (await fetchCsv(state.currentConfig.csvUrl, state.csvCache))
                        .filter(r => !state.currentConfig.extFilter || state.currentConfig.extFilter(r));
                    state.currentConfig.header = csvArray[0];
                    state.currentConfig.records = csvArray.slice(1);
                    state.currentConfig.terms = [ALL_TERM, ...new Set(state.currentConfig.records.map(r => r[CSV_COL.TIMESTAMP].substring(0, 7)))];
                }
                state.$dungeonSelect.innerHTML = state.currentConfig.dungeons
                    .map(d => {
                        const records = getRecords(state.currentConfig, d, state.gearCondition);
                        const count = `${records.length}`.padStart(3, "_");
                        const style = records.length <= 0 ? 'no-rec' : '';
                        return `<option value="${d}" class="${style}">${count}：${d}</option>`;
                    })
                    .join("");
                state.$dungeonSelect.value = state.currentConfig.defaultDungeon;
                state.$recordStyle.innerHTML = state.currentConfig.rowDef.createStyle();
                changeDungeon(state.currentConfig, state.$dungeonSelect.value);
            }
        }

        /**
         * ダンジョン変更
         * @param {CategoryConfig} config
         */
        function changeDungeon(config, targetDungeonName) {
            const terms = state.currentConfig.terms
                .sort().reverse()
                .map(e => {
                    const records = getRecords(config, targetDungeonName, state.gearCondition, e);
                    const style = records.length <= 0 ? 'no-rec' : '';
                    const count = records.length.toString().padStart(3, "_");
                    const disp = `${count}：${e}`;
                    return {
                        value: e,
                        disp: disp,
                        style: style
                    }
                });
            state.$termSelect.innerHTML = terms.map(e => `<option value="${e.value}" class="${e.style}">${e.disp}</option>`).join("");
            state.$termSelect.value = terms.find(e => e.value == ALL_TERM).value;
            loadRecords(
                config,
                targetDungeonName,
                state.$termSelect.value,
            );
        }

        /**
        * @param {CategoryConfig} config
        */
        async function loadRecords(config, targetDungeonName, targetTerm, gearCondition) {
            
            config = config || state.currentConfig;
            targetDungeonName = targetDungeonName || state.dungeonName || config.defaultDungeon;
            targetTerm = targetTerm || state.currentTerm;
            gearCondition = gearCondition || state.gearCondition;

            const regulationName = config.name;
            const rowDef = config.rowDef;
            const records = getRecords(config, targetDungeonName, gearCondition, targetTerm);
            const recordsHtml = records
                .map((r, i) => rowDef.outValue(regulationName, targetDungeonName, r, (i % 2 == 0 ? 'row-odd' : ''), i))
                .join("");
            const header = rowDef.outHeader(regulationName, targetDungeonName, config.header);
            state.$recordsHeader.innerHTML = header;
            state.$main.innerHTML = recordsHtml;

            state.currentConfig = config;
            state.dungeonName = targetDungeonName;
            state.term = targetTerm;
            state.gearCondition = gearCondition;
        }

        /**
         * 装備条件の選択
         */
        function openGearSelect() {
            [
                { elems: Array.from(state.$wepons.querySelectorAll('button')), cond: state.gearCondition.weapons },
                { elems: Array.from(state.$shields.querySelectorAll('button')), cond: state.gearCondition.shields },
                { elems: Array.from(state.$bracelets.querySelectorAll('button')), cond: state.gearCondition.bracelets }
            ].forEach(target => {
                // いったんクリア
                target.elems.forEach(e => {
                    e.classList.remove('active');
                    e.classList.add('inactive');
                });
                // 現在の条件に合うものをアクティブ表示
                target.elems
                    .filter(e => target.cond.includes(e.textContent))
                    .forEach(e => {
                        e.classList.remove('inactive');
                        e.classList.add('active');
                    });
            });
            state.$gearModal.style.visibility = 'visible';
        }

        /**
         * 装備条件の選択
         */
        function closeGear(isDone) {
            if (isDone) {
                state.gearCondition.weapons = Array.from(state.$wepons.querySelectorAll('button.active')).map(e => e.textContent);
                state.gearCondition.shields = Array.from(state.$shields.querySelectorAll('button.active')).map(e => e.textContent);
                state.gearCondition.bracelets = Array.from(state.$bracelets.querySelectorAll('button.active')).map(e => e.textContent);
                loadRecords();
            }
            state.$gearModal.style.visibility = 'hidden';
        }

        /**
         * 読み込み時イベント
         */
        window.onload = async () => {
            try {
                // 画面各要素
                state.$main = document.querySelector('#records');
                state.$recordsHeader = document.querySelector('#recordsHeader');
                state.$dungeonSelect = document.querySelector('#dungeons');
                state.$regulationsSelect = document.querySelector('#regulations');
                state.$termSelect = document.querySelector('#term');
                state.$recordStyle = document.querySelector('#recordStyle');
                state.$gearModal = document.querySelector('#gearWall');
                state.$wepons = document.querySelector('#gearWall .gear-main .weapons .conditions');
                state.$shields = document.querySelector('#gearWall .gear-main .shields .conditions');
                state.$bracelets = document.querySelector('#gearWall .gear-main .bracelets .conditions');
                state.$allSelects = document.querySelectorAll('#gearWall .all-select');
                state.$noSelects = document.querySelectorAll('#gearWall .no-select');
                state.$btnOpenGear = document.querySelector('#openGear');
                state.$btnDone = document.querySelector('#gearWall button.done');
                state.$btnCancel = document.querySelector('#gearWall button.cancel');
                state.$btnHasVideo = document.querySelector('#hasVideo');

                // 装備条件
                state.$wepons.innerHTML += WEAPON_NAMES.map(g => `<button class="item active">${g}</button>`).join("");
                state.$shields.innerHTML += SHIELD_NAMES.map(g => `<button class="item active">${g}</button>`).join("");
                state.$bracelets.innerHTML += BRACELET_NAMES.map(g => `<button class="item active">${g}</button>`).join("");

                // イベント設定
                state.$regulationsSelect.addEventListener('change', () => changeRegulation(state.$regulationsSelect.value));
                state.$dungeonSelect.addEventListener('change', () => changeDungeon(state.currentConfig, state.$dungeonSelect.value));
                state.$termSelect.addEventListener('change', () => loadRecords(state.currentConfig, state.$dungeonSelect.value, state.$termSelect.value));
                state.$wepons.addEventListener('click', (e) => ['active', 'inactive'].forEach(c => e.target.classList.toggle(c)));
                state.$shields.addEventListener('click', (e) => ['active', 'inactive'].forEach(c => e.target.classList.toggle(c)));
                state.$bracelets.addEventListener('click', (e) => ['active', 'inactive'].forEach(c => e.target.classList.toggle(c)));
                state.$allSelects.forEach(s => s.addEventListener('click', (e) => {
                    e.target.closest('.items').querySelectorAll('.conditions button').forEach((b) => {
                        b.classList.add('active');
                        b.classList.remove('inactive');
                    });
                }));
                state.$noSelects.forEach(s => s.addEventListener('click', (e) => {
                    e.target.closest('.items').querySelectorAll('.conditions button').forEach((b) => {
                        b.classList.add('inactive');
                        b.classList.remove('active');
                    });
                }));
                state.$btnOpenGear.addEventListener('click', () => openGearSelect());
                state.$btnDone.addEventListener('click', () => closeGear(true));
                state.$btnCancel.addEventListener('click', () => closeGear(false));
                state.$btnHasVideo.addEventListener('click', (e) =>  {
                    ['active', 'inactive'].forEach(c => e.target.classList.toggle(c));
                    state.hasVideoOnly = e.target.classList.contains('active');
                    loadRecords();
                });

                // レギュ一覧出力
                state.$regulationsSelect.innerHTML = REGURATIONS.map(c => `<option>${c.name}</option>`).join("");

                // 初期表示
                state.$regulationsSelect.value = state.currentConfig.name;
                await changeRegulation(state.currentConfig.name);
            } catch (e) {
                console.error(e);
            }
        };
    </script>
</head>

<body>
    <header>
        <div class="select-box">
            <div class="header-panel">カテゴリ選択</div>
            <div class="header-panel">ダンジョン選択</div>
            <select id='regulations' class="half"></select>
            <select id='dungeons' class="half"></select>
            <div class="header-panel">対象期間</div>
            <div class="header-panel">絞り込む</div>
            <select id='term' class="half"></select>
            <button id='openGear' class="quater">装備条件</button>
            <button id='hasVideo' class="quater inactive">「動画あり」のみ</button>
        </div>
        <div id='recordsHeader'></div>
    </header>
    <main>
        <div id="gearWall">
            <div class="gear-main">
                <div class="gear-header">
                    <button class="cancel">キャンセル</button>
                    <button class="done">決定</button>
                </div>
                <div class="gear-select">
                    <div class="items weapons">
                        <div class="label">武器</div>
                        <button class="all-select">全て選択</button>
                        <button class="no-select">選択解除</button>
                        <div class="conditions"></div>
                    </div>
                    <div class="items shields">
                        <div class="label">盾</div>
                        <button class="all-select">全て選択</button>
                        <button class="no-select">選択解除</button>
                        <div class="conditions"></div>
                    </div>
                    <div class="items bracelets">
                        <div class="label">腕輪</div>
                        <button class="all-select">全て選択</button>
                        <button class="no-select">選択解除</button>
                        <div class="conditions"></div>
                    </div>
                </div>
            </div>
        </div>
        <div id="records"></div>
    </main>
    <style id="recordStyle">

    </style>
</body>

</html>
